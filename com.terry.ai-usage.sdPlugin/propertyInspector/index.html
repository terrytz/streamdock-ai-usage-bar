<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Usage</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1f1f1f;
      --panel: #2a2a2a;
      --text: #f2f2f2;
      --muted: #a9a9a9;
      --line: #3a3a3a;
      --green: #3ddc97;
      --orange: #ff9f43;
      --blue: #66b8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .sdpi-item {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
    }

    .sdpi-item-label {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sdpi-item-value {
      min-width: 0;
      width: 100%;
    }

    .section {
      margin: 0 0 12px;
      padding: 0 0 4px;
      border-bottom: 1px solid var(--line);
    }

    .section-title {
      margin: 14px 0 8px;
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .hint {
      grid-column: 2;
      margin-top: -6px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .inline-status {
      margin-top: 4px;
      color: var(--blue);
      font-size: 11px;
      line-height: 1.3;
      min-height: 14px;
    }

    input,
    select,
    button {
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #151515;
      color: var(--text);
      padding: 5px 7px;
      font: inherit;
    }

    input[type="checkbox"] {
      width: 18px;
      min-height: 18px;
      accent-color: var(--green);
    }

    button {
      background: #303030;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .summary {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .metric {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 56px;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .name {
      color: var(--muted);
    }

    .bar {
      height: 6px;
      border-radius: 3px;
      background: #151515;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: var(--blue);
    }

    .fill.codex {
      background: var(--green);
    }

    .fill.claude {
      background: var(--orange);
    }

    .value {
      text-align: right;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .status {
      color: var(--muted);
      min-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="section">
    <div class="section-title">This Key</div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Display</div>
      <select id="displayMode" class="sdpi-item-value">
        <option value="combined">Combined</option>
        <option value="codex">Codex Overview</option>
        <option value="claude">Claude Overview</option>
        <option value="codex-session">Codex Session</option>
        <option value="codex-weekly">Codex Weekly</option>
        <option value="claude-session">Claude Session</option>
        <option value="claude-weekly">Claude Weekly</option>
        <option value="claude-sonnet">Claude Sonnet</option>
        <option value="cost-30d">30d Cost</option>
        <option value="tokens-today">Today Tokens</option>
        <option value="agent-sessions">Agent Sessions</option>
        <option value="codex-sessions">Codex Sessions</option>
        <option value="claude-sessions">Claude Sessions</option>
        <option value="needs-input">Needs Input</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Shared Data Source</div>
    <div class="sdpi-item">
      <div class="sdpi-item-label">Refresh</div>
      <div class="sdpi-item-value">
        <input id="refreshSeconds" class="sdpi-item-value" type="number" min="10" max="3600" step="5">
        <div id="effectiveRefresh" class="inline-status">Effective: -</div>
      </div>
    </div>
    <div class="hint">All AI Usage keys share one datasource. This value applies to every visible key.</div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Period days</div>
      <input id="windowDays" class="sdpi-item-value" type="number" min="1" max="90" step="1">
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Lookback h</div>
      <input id="sessionLookbackHours" class="sdpi-item-value" type="number" min="1" max="168" step="1">
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Active min</div>
      <input id="activeSessionMinutes" class="sdpi-item-value" type="number" min="5" max="240" step="5">
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Codex data</div>
      <input id="codexPath" class="sdpi-item-value" type="text" spellcheck="false">
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Claude data</div>
      <input id="claudePath" class="sdpi-item-value" type="text" spellcheck="false">
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Subagents</div>
      <div class="row sdpi-item-value">
        <input id="includeClaudeSubagents" type="checkbox">
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Max files</div>
      <input id="maxFiles" class="sdpi-item-value" type="number" min="50" max="10000" step="50">
    </div>
  </div>

  <div class="sdpi-item">
    <div class="sdpi-item-label"></div>
    <button id="refresh" class="sdpi-item-value" type="button">Refresh</button>
  </div>

  <div class="summary">
    <div class="metric">
      <div class="name">Codex</div>
      <div class="bar"><div id="codexFill" class="fill codex"></div></div>
      <div id="codexValue" class="value">-</div>
    </div>
    <div class="metric">
      <div class="name">Claude</div>
      <div class="bar"><div id="claudeFill" class="fill claude"></div></div>
      <div id="claudeValue" class="value">-</div>
    </div>
    <div class="metric">
      <div class="name">Total</div>
      <div class="bar"><div id="totalFill" class="fill"></div></div>
      <div id="totalValue" class="value">-</div>
    </div>
    <div id="status" class="status"></div>
  </div>

  <script>
    const DEFAULT_SETTINGS = {
      windowDays: 1,
      refreshSeconds: 60,
      displayMode: "combined",
      codexPath: "~/.codex",
      claudePath: "~/.claude",
      claudeUsageCommand: "claude",
      claudeUsageTimeoutMs: 8000,
      includeClaudeSubagents: true,
      sessionLookbackHours: 24,
      activeSessionMinutes: 30,
      maxFiles: 2000
    };

    let websocket = null;
    let propertyInspectorUUID = null;
    let actionInfo = null;
    let saveTimer = null;

    const fields = {
      displayMode: document.getElementById("displayMode"),
      windowDays: document.getElementById("windowDays"),
      refreshSeconds: document.getElementById("refreshSeconds"),
      sessionLookbackHours: document.getElementById("sessionLookbackHours"),
      activeSessionMinutes: document.getElementById("activeSessionMinutes"),
      codexPath: document.getElementById("codexPath"),
      claudePath: document.getElementById("claudePath"),
      includeClaudeSubagents: document.getElementById("includeClaudeSubagents"),
      maxFiles: document.getElementById("maxFiles")
    };
    const effectiveRefresh = document.getElementById("effectiveRefresh");

    function parseMaybeJson(value, fallback) {
      if (!value) return fallback;
      if (typeof value === "object") return value;
      try {
        return JSON.parse(value);
      } catch {
        return fallback;
      }
    }

    function applySettings(settings) {
      const merged = { ...DEFAULT_SETTINGS, ...(settings || {}) };
      fields.displayMode.value = merged.displayMode || DEFAULT_SETTINGS.displayMode;
      fields.windowDays.value = merged.windowDays || DEFAULT_SETTINGS.windowDays;
      fields.refreshSeconds.value = merged.refreshSeconds || DEFAULT_SETTINGS.refreshSeconds;
      fields.sessionLookbackHours.value = merged.sessionLookbackHours || DEFAULT_SETTINGS.sessionLookbackHours;
      fields.activeSessionMinutes.value = merged.activeSessionMinutes || DEFAULT_SETTINGS.activeSessionMinutes;
      fields.codexPath.value = merged.codexPath || DEFAULT_SETTINGS.codexPath;
      fields.claudePath.value = merged.claudePath || DEFAULT_SETTINGS.claudePath;
      fields.includeClaudeSubagents.checked = merged.includeClaudeSubagents !== false && merged.includeClaudeSubagents !== "false";
      fields.maxFiles.value = merged.maxFiles || DEFAULT_SETTINGS.maxFiles;
    }

    function renderSharedState(shared) {
      if (!shared) {
        effectiveRefresh.textContent = "Effective: -";
        return;
      }
      const seconds = Number(shared.effectiveRefreshSeconds);
      const count = Number(shared.contextCount) || 0;
      const interval = Number.isFinite(seconds) && seconds > 0 ? `${seconds}s` : "-";
      const keyLabel = count === 1 ? "1 visible key" : `${count} visible keys`;
      effectiveRefresh.textContent = `Effective: ${interval} across ${keyLabel}`;
    }

    function settingsFromForm() {
      const current = parseMaybeJson(actionInfo && actionInfo.payload && actionInfo.payload.settings, {});
      return {
        displayMode: fields.displayMode.value,
        windowDays: Number(fields.windowDays.value || DEFAULT_SETTINGS.windowDays),
        refreshSeconds: Number(fields.refreshSeconds.value || DEFAULT_SETTINGS.refreshSeconds),
        sessionLookbackHours: Number(fields.sessionLookbackHours.value || DEFAULT_SETTINGS.sessionLookbackHours),
        activeSessionMinutes: Number(fields.activeSessionMinutes.value || DEFAULT_SETTINGS.activeSessionMinutes),
        codexPath: fields.codexPath.value.trim() || DEFAULT_SETTINGS.codexPath,
        claudePath: fields.claudePath.value.trim() || DEFAULT_SETTINGS.claudePath,
        claudeUsageCommand: current.claudeUsageCommand || DEFAULT_SETTINGS.claudeUsageCommand,
        claudeUsageTimeoutMs: current.claudeUsageTimeoutMs || DEFAULT_SETTINGS.claudeUsageTimeoutMs,
        includeClaudeSubagents: fields.includeClaudeSubagents.checked,
        maxFiles: Number(fields.maxFiles.value || DEFAULT_SETTINGS.maxFiles)
      };
    }

    function send(payload) {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) return;
      websocket.send(JSON.stringify(payload));
    }

    function saveSettings() {
      if (!actionInfo || !actionInfo.context) return;
      const settings = settingsFromForm();
      send({
        event: "setSettings",
        context: actionInfo.context,
        payload: settings
      });
      send({
        action: actionInfo.action,
        event: "sendToPlugin",
        context: propertyInspectorUUID,
        payload: {
          type: "settings",
          actionContext: actionInfo.context,
          settings
        }
      });
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveSettings, 250);
    }

    function refreshNow() {
      if (!actionInfo || !actionInfo.context) return;
      saveSettings();
      send({
        action: actionInfo.action,
        event: "sendToPlugin",
        context: propertyInspectorUUID,
        payload: {
          type: "refresh",
          actionContext: actionInfo.context
        }
      });
      setStatus("Refreshing");
    }

    function shortNumber(value) {
      const number = Math.round(Number(value) || 0);
      if (Math.abs(number) >= 1000000000) return `${(number / 1000000000).toFixed(1).replace(/\.0$/, "")}B`;
      if (Math.abs(number) >= 1000000) return `${(number / 1000000).toFixed(1).replace(/\.0$/, "")}M`;
      if (Math.abs(number) >= 1000) return `${(number / 1000).toFixed(1).replace(/\.0$/, "")}K`;
      return String(number);
    }

    function providerMetric(provider) {
      return provider.tokens.total || provider.requests || provider.turns || provider.messages || provider.sessions || 0;
    }

    function providerLabel(provider) {
      const session = limitFor(provider, "session");
      const weekly = limitFor(provider, "weekly");
      if (session && weekly) return `S${session.leftPercent} W${weekly.leftPercent}`;
      if (session) return `${session.leftPercent}%`;
      if (provider.tokens.total > 0) return shortNumber(provider.tokens.total);
      if (provider.turns > 0) return `${shortNumber(provider.turns)}t`;
      if (provider.requests > 0) return `${shortNumber(provider.requests)}r`;
      if (provider.messages > 0) return `${shortNumber(provider.messages)}m`;
      if (provider.sessions > 0) return `${shortNumber(provider.sessions)}s`;
      return "0";
    }

    function limitFor(provider, name) {
      return provider && Array.isArray(provider.limits)
        ? provider.limits.find((limit) => limit.name === name)
        : null;
    }

    function setBar(id, value, total) {
      const width = total > 0 ? Math.max(2, Math.round((value / total) * 100)) : 0;
      document.getElementById(id).style.width = `${width}%`;
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text || "";
    }

    function renderSummary(summary) {
      if (!summary || !summary.providers) return;
      const codex = summary.providers.codex;
      const claude = summary.providers.claude;
      const codexMetric = providerMetric(codex);
      const claudeMetric = providerMetric(claude);
      const totalMetric = codexMetric + claudeMetric;

      document.getElementById("codexValue").textContent = providerLabel(codex);
      document.getElementById("claudeValue").textContent = providerLabel(claude);
      document.getElementById("totalValue").textContent = summary.total.tokens.total > 0
        ? shortNumber(summary.total.tokens.total)
        : shortNumber(summary.total.requests || summary.total.turns || summary.total.messages || 0);

      setBar("codexFill", codexMetric, totalMetric);
      setBar("claudeFill", claudeMetric, totalMetric);
      setBar("totalFill", totalMetric, totalMetric);

      const generated = new Date(summary.generatedAt);
      const time = Number.isFinite(generated.getTime())
        ? `${String(generated.getHours()).padStart(2, "0")}:${String(generated.getMinutes()).padStart(2, "0")}`
        : "";
      const errors = summary.total.errors ? `, ${summary.total.errors} errors` : "";
      setStatus(`${summary.periodLabel || ""} updated ${time}${errors}`);
    }

    function handleMessage(event) {
      const data = parseMaybeJson(event.data, null);
      if (!data) return;

      if (data.event === "didReceiveSettings" && data.payload) {
        applySettings(data.payload.settings || data.payload);
      }

      if (data.event === "sendToPropertyInspector" && data.payload) {
        if (data.payload.settings) applySettings(data.payload.settings);
        if (data.payload.summary) renderSummary(data.payload.summary);
        if (data.payload.shared) renderSharedState(data.payload.shared);
      }
    }

    window.connectElgatoStreamDeckSocket = function connectElgatoStreamDeckSocket(
      inPort,
      inPropertyInspectorUUID,
      inRegisterEvent,
      inInfo,
      inActionInfo
    ) {
      propertyInspectorUUID = inPropertyInspectorUUID;
      actionInfo = parseMaybeJson(inActionInfo, {});
      const payload = actionInfo && actionInfo.payload;
      applySettings(payload && (payload.settings || payload));

      websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);
      websocket.onopen = function onopen() {
        send({ event: inRegisterEvent, uuid: inPropertyInspectorUUID });
      };
      websocket.onmessage = handleMessage;
      websocket.onclose = function onclose() {
        setStatus("Disconnected");
      };
    };

    for (const field of Object.values(fields)) {
      field.addEventListener("change", scheduleSave);
      field.addEventListener("input", scheduleSave);
    }

    document.getElementById("refresh").addEventListener("click", refreshNow);
    applySettings(DEFAULT_SETTINGS);
  </script>
</body>
</html>
